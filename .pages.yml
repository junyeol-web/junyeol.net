# Pages CMS — edit this site at https://app.pagescms.org (sign in with GitHub).
# Every save is a commit to this repo; GitHub Actions rebuilds and deploys the site.

media:
  input: content/media
  output: /media

content:
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, category, year, draft]
      primary: title
      sort: [order, year, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: One-line idea
        description: Shown under the title and in link previews. One sentence.
        type: string
      - name: year
        label: Year
        type: number
      - name: category
        label: Section
        description: Practice = your own work, Commissions = client work.
        type: select
        default: Practice
        options:
          values: [Practice, Commissions]
      - name: format
        label: Format / specs
        description: Shown under the images in the feed, e.g. "Poster series, 594 × 841 mm, risograph"
        type: string
      - name: discipline
        label: Discipline
        description: e.g. Identity system, Campaign / Art direction, Editorial, Type design
        type: string
      - name: client
        label: Client
        type: string
      - name: studio
        label: Studio
        description: Where you made it, if not on your own (e.g. AABB)
        type: string
      - name: role
        label: Your role
        description: e.g. Art direction, design
        type: string
      - name: credits
        label: Credits
        description: 'One per line. To link a name, write [Name](https://their-site.com) — e.g. Photography: [Dohyun Park](https://instagram.com/…)' 
        type: text
      - name: description
        label: Description
        description: Short paragraphs. Markdown links work, e.g. [text](https://…)
        type: text
      - name: cover
        label: Cover image
        description: Shown whole (never cropped) on a plate in the grid, and used as the link preview image. An mp4 can't go here; put videos in Images and videos. Upload JPG or PNG — it is converted to WebP automatically.
        type: image
      - name: cover_vimeo
        label: Cover video (Vimeo, optional)
        description: A Vimeo link. A short silent clip of it loops on the grid tile, on top of the cover image (which still shows while it loads and in link previews).
        type: string
      - name: cover_vimeo_start
        label: Cover video — from (seconds)
        type: number
        default: 0
      - name: cover_vimeo_end
        label: Cover video — to (seconds)
        description: The clip loops between these two points. Default 0 to 6.
        type: number
        default: 6
      - name: size
        label: Size (not used by the grid layout)
        description: Only used by the single-column layout. Leave as is.
        type: select
        default: m
        options:
          values: [s, m, l]
      - name: media
        label: Images and videos
        description: In order, top to bottom.
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image
          - name: vimeo
            label: Vimeo link (optional)
            description: Paste the video's Vimeo address, e.g. https://vimeo.com/123456789 (unlisted links with a code at the end work too). Shown instead of the image.
            type: string
          - name: vimeo_mode
            label: Vimeo playback
            description: loop = plays silently on repeat like a moving image; player = normal player with sound and controls.
            type: select
            default: loop
            options:
              values: [loop, player]
          - name: video
            label: Video file (optional, short mp4 only)
            description: For very short clips. Longer videos belong on Vimeo.
            type: file
            options:
              extensions: [mp4, webm]
          - name: caption
            label: Caption
            type: string
          - name: layout
            label: Layout
            type: select
            default: full
            options:
              values: [full, half, inset]
      - name: featured
        label: Selected work
        description: Its cover is used as the site's link-preview image.
        type: boolean
      - name: order
        label: Order
        description: Lower numbers come first (10, 20, 30… leaves room to insert).
        type: number
      - name: draft
        label: Hide (draft)
        type: boolean

  - name: site
    label: Information & settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
      - name: role
        label: Role line
        type: string
      - name: location
        label: Location
        type: string
      - name: status
        label: Currently
        type: string
      - name: bio
        label: Bio
        description: First paragraph is large; the next ones are gray.
        type: text
      - name: email
        label: Email
        type: string
      - name: instagram
        label: Instagram
        description: "@name, or the profile link — shown as @name"
        type: string
      - name: linkedin
        label: LinkedIn URL
        type: string
      - name: cv
        label: CV (PDF)
        type: file
        options:
          extensions: [pdf]
      - name: theme
        label: Theme
        type: select
        default: white
        options:
          values: [white, grey, black, richblack]
      - name: plates
        label: Plates behind works
        description: Off = works stand on their own, bottoms aligned. On = each work sits on a grey plate with a soft shadow.
        type: boolean
      - name: label_practice
        label: Section name — own work
        description: e.g. Practice, Work P
        type: string
      - name: label_commissions
        label: Section name — client work
        description: e.g. Commissions, Work C
        type: string
      - name: accent
        label: Accent color
        description: Hex, e.g. #ff3b00
        type: string
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - { name: label, label: Item, type: string }
          - { name: url, label: Link (optional), type: string }
          - { name: year, label: Year, type: string }
      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - { name: label, label: Item, type: string }
          - { name: url, label: Link (optional), type: string }
          - { name: year, label: Year, type: string }
      - name: clients
        label: Clients & collaborators
        type: string
        list: true
      - name: recognition
        label: Exhibitions, awards, press
        type: object
        list: true
        fields:
          - { name: label, label: Item, type: string }
          - { name: year, label: Year, type: string }
      - name: seo_description
        label: Search / link-preview description
        type: string
